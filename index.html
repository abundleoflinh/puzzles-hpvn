<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="site.tabTitle">Puzzles</title>
  <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+SC:wght@500;600;700&display=swap" />
</head>
<body>
  <div class="page">
    <header class="page-header" data-slot="header"></header>
    <main class="page-main home-main">
      <div class="home-content">
        <p class="home-greeting" data-i18n="home.greeting"></p>
        <form id="play-form">
          <div class="field">
            <input type="text" id="puzzle-input" data-i18n-attr="placeholder:home.input.placeholder" autocomplete="off" spellcheck="false" />
            <button type="submit" class="btn btn-primary" data-i18n="home.input.go"></button>
          </div>
          <p id="puzzle-error" class="notice-error" hidden></p>
        </form>
        <section id="collections-slot" class="collections" aria-live="polite"></section>
      </div>
    </main>
    <footer class="page-footer" data-slot="footer"></footer>
  </div>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
